name: Check Push

on:
  push:
    branches: # Specifica che il workflow si attiva solo sui branch
      - '**' # Questo include tutti i branch, puoi specificare solo quelli che vuoi
    tags-ignore: # Evita l'attivazione su tag
      - '*' # Questo include tutti i tag, puoi specificare solo quelli che vuoi

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Testing
        run: pnpm test
  